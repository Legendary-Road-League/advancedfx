// Load these optional spectator bindings with: exec lrl_nadecam
// CS2 1.42.0.1 accepts this explicit binding when bindtoggle leaves F8 unbound.
bind F8 "toggle mirv_nadecam_mode 0 1"

// F9 cycles off -> picture-in-picture -> fullscreen -> off from the current mode.
alias nade_cycle "toggle mirv_nadecam_mode 0 1 2"
bind F9 nade_cycle

// Optional fullscreen-only switch. Bind nade_fulltoggle to a key of your choice.
alias nade_fulltoggle "toggle mirv_nadecam_mode 0 2"
